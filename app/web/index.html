<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainstormer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <style>
    /* The page is an instrument, not a chat window. One luminous readout in the
       middle, quiet calibration marks around it, and the conversation logged
       underneath. The accent colour belongs to the MODE, not to the brand —
       every hue below is derived from --hue, which the client rewrites when the
       profile is swapped. That is why switching mode recolours the machine. */
    :root {
      --hue: 190;

      --ink: #0c1319;
      --ink-lift: #111b23;
      --rule: #1e2c36;
      --text: #d6e2ea;
      --dim: #6f8697;

      --accent: hsl(var(--hue) 85% 62%);
      --accent-soft: hsl(var(--hue) 70% 62% / 0.16);
      --accent-line: hsl(var(--hue) 60% 55% / 0.4);

      --ui: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --read: "Newsreader", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--text);
      font: 400 15px/1.5 var(--ui);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 28px 20px 64px;
      /* Colour transitions rather than snaps, so a mode switch reads as the
         instrument re-tuning instead of the page reloading. */
      transition: background-color .6s ease;
    }

    main { width: 100%; max-width: 720px; }

    /* The instrument never leaves the frame. Narrow: a compact strip stuck to
       the top. Wide: a fixed stage beside the transcript. */
    .stage { position: sticky; top: 0; z-index: 2; background: var(--ink); }
    body.in-call .stage { border-bottom: 1px solid var(--rule); }
    body.in-call #transcript { border-top: 0; }
    body.in-call .controls { padding: 6px 0 12px; gap: 6px; }
    body.in-call .instrument { max-height: 148px; }

    @media (min-width: 980px) {
      main { max-width: 1120px; }
      .deck { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 64px; align-items: start; }
      .stage { top: 28px; }
      body.in-call .stage { border-bottom: 0; }
      body.in-call .instrument { max-height: 300px; }
      body.in-call .controls { padding: 18px 0 22px; gap: 10px; }
      #transcript { border-top: 0; padding-top: 6px; }
    }

    /* --- header: identity left, live state right ------------------------- */

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
    }
    .wordmark {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .meta {
      font-size: 13px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    #live-mode { color: var(--accent); transition: color .6s ease; }
    .meta .sep { color: var(--rule); }

    /* --- the instrument --------------------------------------------------- */

    .instrument {
      position: relative;
      display: grid;
      place-items: center;
      /* Reserves the square the canvas paints into, so nothing below it moves
         when the aura starts breathing. */
      aspect-ratio: 1;
      max-height: 300px;
      margin: 0 auto;
    }
    #aura { width: 100%; height: 100%; display: block; }

    /* Sits inside the ring. Two lines: what the machine is doing, and the
       number that governs it. The number is the point — it is the parameter
       the mode changed. */
    .readout {
      position: absolute;
      text-align: center;
      pointer-events: none;
    }
    .readout .doing {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: .01em;
    }
    .readout .figure {
      font-size: 28px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }
    .readout .figure .unit { font-size: 15px; color: var(--dim); font-weight: 400; }
    .readout .caption { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
    body.in-call .readout .caption { display: none; }
    @media (min-width: 980px) { body.in-call .readout .caption { display: block; } }

    /* --- controls --------------------------------------------------------- */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 18px 0 22px;
    }

    .modes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .mode {
      font: 500 13px var(--ui);
      background: transparent;
      color: var(--dim);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 7px 15px;
      cursor: pointer;
      transition: color .25s, border-color .25s, background-color .25s;
    }
    .mode:hover { color: var(--text); }
    .mode small { font-size: 11px; font-weight: 400; color: var(--dim); margin-left: 6px; }
    .meta a { color: var(--dim); text-decoration: none; }
    .meta a:hover { color: var(--accent); }
    .mode.pinned::after {
      content: ' •';           /* hand on the wheel: router is muted for this call */
      opacity: .7;
    }
    .mode.born { animation: born .7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .mode.new::before {
      content: 'new'; font-size: 11px; font-weight: 500; letter-spacing: .04em;
      color: var(--ink); background: var(--accent); border-radius: 999px; padding: 1px 7px; margin-right: 7px;
    }
    @keyframes born {
      from { opacity: 0; transform: scale(.6); filter: blur(4px); }
      to   { opacity: 1; transform: scale(1);  filter: blur(0); }
    }
    .instrument::after {
      content: ''; position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%;
      border: 1px solid var(--accent); opacity: 0; pointer-events: none;
    }
    .instrument.birth::after { animation: wave 1.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes wave {
      from { opacity: .9; transform: scale(.9); }
      to   { opacity: 0;  transform: scale(1.7); }
    }
    .mode.on {
      color: var(--accent);
      border-color: var(--accent-line);
      background: var(--accent-soft);
    }

    #btn {
      font: 500 13px var(--ui);
      color: var(--ink);
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      padding: 8px 20px;
      cursor: pointer;
      transition: background-color .6s ease, opacity .2s;
    }
    #btn.live {
      background: transparent;
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--rule);
    }
    #btn:disabled { opacity: .45; cursor: default; }

    /* --- transcript ------------------------------------------------------- */

    #transcript {
      border-top: 1px solid var(--rule);
      padding-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Speech is set in a reading face, not the instrument's grotesque. The
       machine and the person should not sound the same on the page. */
    .line { display: grid; grid-template-columns: 58px 1fr; gap: 16px; }
    .who {
      font-size: 11px;
      color: var(--dim);
      padding-top: 5px;
      letter-spacing: .02em;
    }
    .line.agent .who { color: var(--accent); transition: color .6s ease; }
    .said {
      font: 400 17px/1.55 var(--read);
      color: var(--text);
    }
    .partial .said { color: var(--dim); }

    .empty { color: var(--dim); font-size: 14px; }

    /* The switch marker. This is the proof, not a log line: the profile
       changed on a socket that never closed. It gets a full rule and the
       mode's own colour. */
    .switch {
      /* Re-declared locally so an inline --hue on the element re-derives them.
         --accent on :root is computed once and inherited as a fixed value, so
         overriding --hue alone would not reach it. */
      --accent: hsl(var(--hue) 85% 62%);
      --accent-line: hsl(var(--hue) 60% 55% / 0.4);
      border-top: 1px solid var(--accent-line);
      padding-top: 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      transition: color .6s ease, border-color .6s ease;
    }
    .switch .how { color: var(--dim); font-weight: 400; margin-left: 8px; }
    .switch .why { display: block; margin-top: 4px; font: 400 15px/1.5 var(--read); color: var(--text); }
    .switch .deltas {
      display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 8px;
      font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
    }
    .switch .deltas .was { color: var(--dim); font-weight: 400; text-decoration: line-through; margin-right: 2px; }
    .switch .deltas .to { color: var(--dim); font-weight: 400; margin: 0 5px; }
    .switch details { margin-top: 6px; color: var(--dim); font-weight: 400; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .switch summary { cursor: pointer; width: fit-content; }
    .switch details p { margin: 4px 0 0; line-height: 1.6; }

    /* A tool ran. This is machine activity, not conversation, so it is set in
       the instrument's face and sits in the speech column without a speaker
       label — deliberately quieter than a switch marker, which is the proof of
       the whole design. */
    .tool {
      font: 500 12px var(--ui);
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      padding-left: 74px;
    }
    .tool .detail {
      display: block;
      margin-top: 2px;
      font-weight: 400;
      color: #4b5f6e;
    }

    @media (max-width: 560px) { .tool { padding-left: 58px; } }

    .error { color: #ff8b8b; }

    @media (max-width: 560px) {
      .head { flex-direction: column; align-items: flex-start; gap: 6px; }
      .instrument { max-height: 260px; }
      .line { grid-template-columns: 46px 1fr; gap: 12px; }
      .said { font-size: 16px; }
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    ::selection { background: var(--accent-soft); color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .mode.born { animation: none; }
      .instrument.birth::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <h1 class="wordmark">Brainstormer</h1>
      <div class="meta">
        <span id="live-mode">no profile</span>
        <span class="sep">/</span>
        <span id="status-text">idle</span>
        <span class="sep">/</span>
        <span id="elapsed">0:00</span>
        <span class="sep">/</span>
        <a id="evolution-link" href="/evolution" target="_blank">how it changed</a>
      </div>
    </div>

    <div class="deck">
      <div class="stage">
        <div class="instrument" id="instrument">
          <canvas id="aura"></canvas>
          <div class="readout">
            <div class="doing" id="doing">not listening</div>
            <div class="figure" id="figure">—</div>
            <div class="caption">silence before it answers</div>
          </div>
        </div>

        <div class="controls">
          <div class="modes" id="modes"></div>
          <button id="btn">Start call</button>
        </div>
      </div>

      <div id="transcript" role="log" aria-live="polite"><p class="empty">Start the call, allow the microphone, and talk. Say what you are doing, for example "I am about to start my set", and the mode follows you.</p></div>
    </div>
  </main>

  <script>window.AGENT_ID = "{{AGENT_ID}}"</script>
  <script src="/client.js"></script>
</body>
</html>
